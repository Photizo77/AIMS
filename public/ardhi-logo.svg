<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" fill="none">
  <!-- Red arc top -->
  <path d="M28 40 A24 24 0 0 1 76 40" stroke="#e8302a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Green land base -->
  <ellipse cx="52" cy="63" rx="26" ry="9" fill="#4caf50"/>
  <!-- Tree trunk -->
  <rect x="50" y="44" width="4" height="18" rx="2" fill="#1a2a4a"/>
  <!-- Roots left -->
  <path d="M52 62 Q44 66 38 68" stroke="#1a2a4a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M52 62 Q46 67 42 72" stroke="#1a2a4a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Roots right -->
  <path d="M52 62 Q60 66 66 68" stroke="#1a2a4a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M52 62 Q58 67 62 72" stroke="#1a2a4a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Body/person center -->
  <circle cx="52" cy="28" r="5" fill="#1a2a4a"/>
  <!-- Arms horizontal -->
  <line x1="32" y1="36" x2="72" y2="36" stroke="#1a2a4a" stroke-width="3" stroke-linecap="round"/>
  <!-- Scales on left arm -->
  <line x1="32" y1="36" x2="32" y2="44" stroke="#1a2a4a" stroke-width="2" stroke-linecap="round"/>
  <path d="M26 44 Q32 42 38 44" stroke="#1a2a4a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Scales on right arm -->
  <line x1="72" y1="36" x2="72" y2="44" stroke="#1a2a4a" stroke-width="2" stroke-linecap="round"/>
  <path d="M66 44 Q72 42 78 44" stroke="#1a2a4a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Small person left -->
  <circle cx="36" cy="26" r="3.5" fill="#1a2a4a"/>
  <path d="M36 30 L36 38" stroke="#1a2a4a" stroke-width="2" stroke-linecap="round"/>
  <!-- Small person right -->
  <circle cx="68" cy="26" r="3.5" fill="#1a2a4a"/>
  <path d="M68 30 L68 38" stroke="#1a2a4a" stroke-width="2" stroke-linecap="round"/>

  <!-- ARDHI text -->
  <text x="94" y="40" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="26" fill="#1a2a4a" letter-spacing="1">ARDHI</text>
  <!-- Tagline -->
  <text x="94" y="56" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="10" fill="#1a2a4a">Research. Advocacy. Innovation</text>
</svg>
